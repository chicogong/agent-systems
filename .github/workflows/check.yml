name: Check guide structure

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/build_pi_figures.py
      - run: git diff --exit-code -- figures/pi-architecture/scene.excalidraw figures/pi-extensions/scene.excalidraw
      - run: python3 scripts/check_repo.py
