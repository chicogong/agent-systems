name: Check guide structure

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/rebuild_scenes.py
      - run: git diff --exit-code -- 'figures/**/scene.excalidraw'
      - run: python3 scripts/check_repo.py
      - run: python3 scripts/check_sources.py
      - run: python3 scripts/build_markdown.py
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
